<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panini World Cup Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root { --panini-red: #d71920; --dark-bg: #121212; --accent: #00ffcc; }
        body { font-family: sans-serif; background: var(--dark-bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; }
        #camera-container { position: relative; width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50%; height: 20%; border: 2px solid var(--accent); border-radius: 40px; /* Pill shape */
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); pointer-events: none; 
        }
        .overlay::after { content: "CENTER THE CODE HERE"; position: absolute; top: -25px; width: 100%; text-align: center; font-size: 12px; color: var(--accent); font-weight: bold; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; width: 100%; }
        button { padding: 18px; font-size: 16px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; }
        #snap-btn { background: var(--panini-red); color: white; }
        .secondary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #copy-btn { background: #444; color: white; }
        #status { margin: 15px 0; text-align: center; color: #ffd700; min-height: 20px; }
        .results { background: #1e1e1e; padding: 15px; border-radius: 10px; border: 1px solid #333; margin-top: 10px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--panini-red)">W.C. 2026 SCANNER</h2>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="overlay"></div>
    </div>

    <div id="status">Align code & tap Scan</div>

    <div class="controls">
        <button id="snap-btn">📸 SCAN CODE</button>
        <div class="secondary">
            <button id="copy-btn" onclick="copyList()">COPY LIST</button>
            <button style="background:#222; color:#888" onclick="clearList()">CLEAR</button>
        </div>
    </div>

    <div class="results">
        <div id="result-list" style="font-family: monospace; word-break: break-all;">No stickers yet.</div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const resultList = document.getElementById('result-list');
    let scanned = new Set();

    async function startCam() {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", width: 1280 } 
        });
        video.srcObject = stream;
    }

    document.getElementById('snap-btn').addEventListener('click', async () => {
        status.innerText = "⚡ Processing...";
        const ctx = canvas.getContext('2d');
        
        // Capture only the center area (the overlay) for better accuracy
        const zoom = 2; // Digital zoom for the OCR
        canvas.width = 400;
        canvas.height = 200;
        
        ctx.drawImage(video, video.videoWidth/4, video.videoHeight/2.5, video.videoWidth/2, video.videoHeight/4, 0, 0, 400, 200);

        // --- PRE-PROCESSING: INVERT & CONTRAST ---
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            // Convert to grayscale and Invert (for light text on dark background)[span_1](start_span)[span_1](end_span)
            let avg = (data[i] + data[i+1] + data[i+2]) / 3;
            let inverted = 255 - avg;
            // High contrast threshold
            let v = inverted > 128 ? 255 : 0; 
            data[i] = data[i+1] = data[i+2] = v;
        }
        ctx.putImageData(imgData, 0, 0);

        try {
            const { data: { text } } = await Tesseract.recognize(canvas.toDataURL(), 'eng');
            // Regex: 3 letters, optional space, 1-2 digits[span_2](start_span)[span_2](end_span)
            const pattern = /[A-Z]{3}\s?\d{1,2}/g;
            const found = text.toUpperCase().match(pattern);

            if (found) {
                found.forEach(item => scanned.add(item.replace(/\s/g, ' '))); // Normalize space
                updateUI();
                status.innerText = "✅ Found: " + found[0];
            } else {
                status.innerText = "❌ Not found. Keep steady!";
            }
        } catch (e) { status.innerText = "Error scanning."; }
    });

    function updateUI() {
        resultList.innerText = Array.from(scanned).sort().join(', ');
    }

    function copyList() {
        navigator.clipboard.writeText(resultList.innerText);
        status.innerText = "Copied to clipboard!";
    }

    function clearList() { if(confirm("Clear?")) { scanned.clear(); updateUI(); } }

    startCam();
</script>
</body>
</html>
